---
# Uptime Kuma IngressRoute
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: uptime-kuma
  namespace: monitoring
  annotations:
    # external-dns: create uptime.jamilshaikh.in CNAME → cloudflare tunnel
    external-dns.alpha.kubernetes.io/target: "3a067db9-77b1-49c9-a3d4-30f86d16c80d.cfargotunnel.com"
spec:
  entryPoints:
    - web
  routes:
    # Public status API: allow the portfolio (jamilshaikh.in) to read it from the browser.
    - match: Host(`uptime.jamilshaikh.in`) && PathPrefix(`/api/status-page`)
      kind: Rule
      priority: 100
      middlewares:
        - name: kuma-status-cors
      services:
        - name: uptime-kuma
          port: 3001
    - match: Host(`uptime.jamilshaikh.in`)
      kind: Rule
      services:
        - name: uptime-kuma
          port: 3001
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: kuma-status-cors
  namespace: monitoring
spec:
  headers:
    accessControlAllowMethods: ["GET"]
    accessControlAllowOriginList: ["https://jamilshaikh.in", "https://www.jamilshaikh.in"]
    accessControlMaxAge: 600
    addVaryHeader: true
