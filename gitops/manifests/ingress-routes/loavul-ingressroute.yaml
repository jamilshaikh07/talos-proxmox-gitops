apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: loavul
  namespace: loavul
  annotations:
    external-dns.alpha.kubernetes.io/target: "3a067db9-77b1-49c9-a3d4-30f86d16c80d.cfargotunnel.com"
spec:
  entryPoints:
    - web
  routes:
    # App is branded "Anvil"; the old loavul host keeps working as a redirect.
    - match: Host(`anvil.jamilshaikh.in`) && !PathPrefix(`/api/metrics`)
      kind: Rule
      middlewares:
        - name: frame-protect
      services:
        - name: loavul-web
          port: 80
    - match: Host(`loavul.jamilshaikh.in`)
      kind: Rule
      middlewares:
        - name: redirect-to-anvil
      services:
        - name: loavul-web
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-anvil
  namespace: loavul
spec:
  redirectRegex:
    regex: "^https?://loavul\\.jamilshaikh\\.in/(.*)"
    replacement: "https://anvil.jamilshaikh.in/${1}"
    permanent: false
