apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: loavul
  namespace: loavul
  annotations:
    external-dns.alpha.kubernetes.io/target: "3a067db9-77b1-49c9-a3d4-30f86d16c80d.cfargotunnel.com"
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`loavul.jamilshaikh.in`) && !PathPrefix(`/api/metrics`)
      kind: Rule
      services:
        - name: loavul-web
          port: 80
