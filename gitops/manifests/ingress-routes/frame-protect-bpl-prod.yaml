# Content-Security-Policy for the BPL site. Everything is same-origin (fonts are self-hosted); the only third
# parties are YouTube embeds (live stream) and https images (owner/player photos).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: frame-protect
  namespace: bpl-prod
spec:
  headers:
    contentSecurityPolicy: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' wss://belapurpremierleague.com wss://www.belapurpremierleague.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"
