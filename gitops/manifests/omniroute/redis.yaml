apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: omniroute
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:8-alpine
        args: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: 32Mi
            cpu: 20m
          limits:
            memory: 128Mi
        volumeMounts:
        - name: data
          mountPath: /data
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: omniroute-redis
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: omniroute-redis
  namespace: omniroute
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: omniroute
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
