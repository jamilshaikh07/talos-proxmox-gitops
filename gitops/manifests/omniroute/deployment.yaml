apiVersion: apps/v1
kind: Deployment
metadata:
  name: omniroute
  namespace: omniroute
  labels:
    app: omniroute
spec:
  replicas: 1
  selector:
    matchLabels:
      app: omniroute
  template:
    metadata:
      labels:
        app: omniroute
    spec:
      containers:
      - name: omniroute
        image: diegosouzapw/omniroute:latest
        ports:
        - containerPort: 20128
          name: http
        env:
        - name: NODE_ENV
          value: production
        - name: PORT
          value: "20128"
        - name: DATA_DIR
          value: /app/data
        - name: REDIS_URL
          value: redis://redis:6379
        - name: HOSTNAME
          value: "0.0.0.0"
        envFrom:
        - secretRef:
            name: omniroute-secrets
        volumeMounts:
        - name: data
          mountPath: /app/data
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 500m
        readinessProbe:
          httpGet:
            path: /api/health
            port: 20128
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 5
        livenessProbe:
          httpGet:
            path: /api/health
            port: 20128
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 3
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: omniroute-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: omniroute-data
  namespace: omniroute
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
