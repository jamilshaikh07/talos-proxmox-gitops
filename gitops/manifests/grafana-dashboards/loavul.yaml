apiVersion: v1
kind: ConfigMap
metadata:
  name: loavul-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "homelab"
data:
  loavul.json: |
    {
      "title": "LoaVul",
      "uid": "loavul-app",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "tags": [
        "loavul"
      ],
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Scans finished (per 5m) by type/status",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (type,status)(increase(loavul_scans_total[5m]))",
              "legendFormat": "{{type}} {{status}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              }
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Scans running",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(loavul_scans_running)",
              "legendFormat": "running",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              }
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Queue waiting",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(loavul_queue_waiting)",
              "legendFormat": "waiting",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              }
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Findings stored by severity (total)",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (severity)(loavul_findings_total)",
              "legendFormat": "{{severity}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              }
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Worker memory",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "container_memory_working_set_bytes{namespace=\"loavul\",container=\"worker\"}",
              "legendFormat": "{{pod}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              }
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Scanner pods CPU (loavul-scanners)",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "x": 12,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod)(rate(container_cpu_usage_seconds_total{namespace=\"loavul-scanners\",container!=\"\"}[1m]))",
              "legendFormat": "{{pod}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              }
            }
          ]
        }
      ],
      "templating": {
        "list": [
          {
            "name": "ds",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "label": "Datasource"
          }
        ]
      }
    }
