apiVersion: v1
kind: ConfigMap
metadata:
  name: bpl-loadtest
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "homelab"
data:
  bpl-loadtest.json: |
    {
      "title": "BPL Load Test",
      "uid": "bpl-loadtest",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "tags": [
        "loavul",
        "load-test",
        "bpl"
      ],
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Requests/sec (BPL, via Traefik)",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (code)(rate(traefik_service_requests_total{exported_service=~\"bpl-prod.*\"}[1m]))",
              "legendFormat": "{{code}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              }
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "5xx error rate %",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100*sum(rate(traefik_service_requests_total{exported_service=~\"bpl-prod.*\",code=~\"5..\"}[1m]))/sum(rate(traefik_service_requests_total{exported_service=~\"bpl-prod.*\"}[1m]))",
              "legendFormat": "5xx %",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              }
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Latency p50/p95/p99",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.5,sum by (le)(rate(traefik_service_request_duration_seconds_bucket{exported_service=~\"bpl-prod.*\"}[1m])))",
              "legendFormat": "p50",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              }
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95,sum by (le)(rate(traefik_service_request_duration_seconds_bucket{exported_service=~\"bpl-prod.*\"}[1m])))",
              "legendFormat": "p95",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              }
            },
            {
              "refId": "C",
              "expr": "histogram_quantile(0.99,sum by (le)(rate(traefik_service_request_duration_seconds_bucket{exported_service=~\"bpl-prod.*\"}[1m])))",
              "legendFormat": "p99",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              }
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Traefik open connections",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(traefik_open_connections)",
              "legendFormat": "open",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              }
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Pod CPU (cores) bpl-prod",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod)(rate(container_cpu_usage_seconds_total{namespace=\"bpl-prod\",container!=\"\"}[1m]))",
              "legendFormat": "{{pod}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              }
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Pod memory bpl-prod",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "x": 12,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod)(container_memory_working_set_bytes{namespace=\"bpl-prod\",container!=\"\"})",
              "legendFormat": "{{pod}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              }
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Pod network in (bytes/s) bpl-prod",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod)(rate(container_network_receive_bytes_total{namespace=\"bpl-prod\"}[1m]))",
              "legendFormat": "{{pod}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              }
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Container restarts (last 1h) bpl-prod",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "x": 12,
            "y": 24,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod)(increase(kube_pod_container_status_restarts_total{namespace=\"bpl-prod\"}[1h]))",
              "legendFormat": "{{pod}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              }
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Node CPU %",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "x": 0,
            "y": 32,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100-100*avg by (instance)(rate(node_cpu_seconds_total{mode=\"idle\"}[1m]))",
              "legendFormat": "{{instance}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              }
            }
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Node memory available",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "gridPos": {
            "x": 12,
            "y": 32,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "node_memory_MemAvailable_bytes",
              "legendFormat": "{{instance}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              }
            }
          ]
        }
      ],
      "templating": {
        "list": [
          {
            "name": "ds",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "label": "Datasource"
          }
        ]
      }
    }
