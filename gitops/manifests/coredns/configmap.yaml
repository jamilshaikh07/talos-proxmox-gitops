apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health {
            lameduck 5s
        }
        ready
        log . {
            class error
        }
        prometheus :9153

        kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
            ttl 30
        }
        # Cluster has no IPv6 connectivity — suppress AAAA responses so
        # clients fall back to A records instead of timing out on IPv6.
        template IN AAAA . {
            rcode NOERROR
        }
        forward . 1.1.1.1 1.0.0.1 8.8.8.8 {
           max_concurrent 1000
           # health_check probes upstreams every 5s and skips unhealthy ones.
           # force_tcp removed: TCP connections can silently hang causing
           # cluster-wide DNS failures until CoreDNS is restarted.
           health_check 5s
        }
        cache 300 {
           disable success cluster.local
           disable denial cluster.local
        }
        loop
        loadbalance
    }
