---
# ConfigMap: cloudflared ingress rules (GitOps-managed, no Cloudflare dashboard needed)
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: cloudflared
data:
  config.yaml: |
    tunnel: 3a067db9-77b1-49c9-a3d4-30f86d16c80d
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    protocol: http2
    ingress:
      # Wildcard: all *.jamilshaikh.in → Traefik (Cloudflare handles public TLS)
      - hostname: "*.jamilshaikh.in"
        service: http://traefik.traefik-system.svc.cluster.local
      # belapurpremierleague.com (prod for BPL Season 2) → Traefik
      - hostname: "belapurpremierleague.com"
        service: http://traefik.traefik-system.svc.cluster.local
      - hostname: "*.belapurpremierleague.com"
        service: http://traefik.traefik-system.svc.cluster.local
      # spinup.in (Spinup PaaS — control-plane at apex, tenants at *.spinup.in)
      # Both apex and wildcard needed: cloudflared's single-label wildcard
      # does NOT cover the bare apex, and the dashboard lives at the apex.
      - hostname: "spinup.in"
        service: http://traefik.traefik-system.svc.cluster.local
      - hostname: "*.spinup.in"
        service: http://traefik.traefik-system.svc.cluster.local
      # Spinup tenant custom domain (urbanequestrian.in)
      - hostname: "urbanequestrian.in"
        service: http://traefik.traefik-system.svc.cluster.local
      - hostname: "*.urbanequestrian.in"
        service: http://traefik.traefik-system.svc.cluster.local
      # Spinup tenant custom domain (chemdesk.in)
      - hostname: "chemdesk.in"
        service: http://traefik.traefik-system.svc.cluster.local
      - hostname: "*.chemdesk.in"
        service: http://traefik.traefik-system.svc.cluster.local
      # iqama.space (public product, no *.jamilshaikh.in wildcard coverage)
      - hostname: "iqama.space"
        service: http://traefik.traefik-system.svc.cluster.local
      - hostname: "*.iqama.space"
        service: http://traefik.traefik-system.svc.cluster.local
      # Required catch-all
      - service: http_status:404
---
# Cloudflared Tunnel Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
  labels:
    app: cloudflared
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      # talos-wk-01's Cilium datapath is intermittently flaky for in-cluster
      # service traffic (DNS UDP to CoreDNS AND plain TCP to ClusterIPs) —
      # observed causing "Unable to reach the origin service ... i/o timeout"
      # on the tunnel replica scheduled there (648 timeouts vs 0 on
      # talos-cp-01 over the same window), surfacing to visitors as
      # Cloudflare 502 "Bad gateway" pages. Pin both replicas to cp-01 until
      # wk-01's networking is fixed or a third, healthier node is added.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - talos-cp-01
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 10.96.0.10
        searches:
          - cloudflared.svc.cluster.local
          - svc.cluster.local
          - cluster.local
        options:
          - name: ndots
            value: "5"
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2025.2.1
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config/config.yaml
            - run
          ports:
            - containerPort: 2000
              name: metrics
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            httpGet:
              path: /ready
              port: 2000
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config
              readOnly: true
            - name: creds
              mountPath: /etc/cloudflared/creds
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: cloudflared-config
        - name: creds
          secret:
            secretName: cloudflared-credentials
      restartPolicy: Always
