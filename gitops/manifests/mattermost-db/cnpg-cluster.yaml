apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mattermost-db
  namespace: mattermost
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5
  storage:
    storageClass: local-path
    size: 3Gi
  walStorage:
    storageClass: local-path
    size: 1Gi
  bootstrap:
    initdb:
      database: mattermost
      owner: mattermost
      secret:
        name: mattermost-db-user
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "128MB"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  backup:
    retentionPolicy: 30d
    barmanObjectStore:
      destinationPath: s3://bpl-db-backups/mattermost-db/
      endpointURL: http://192.168.60.2:9900
      s3Credentials:
        accessKeyId: { name: db-backup-s3, key: ACCESS_KEY_ID }
        secretAccessKey: { name: db-backup-s3, key: ACCESS_SECRET_KEY }
      data: { compression: gzip }
      wal: { compression: gzip, maxParallel: 2 }
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: mattermost-db-nightly
  namespace: mattermost
spec:
  backupOwnerReference: self
  cluster: { name: mattermost-db }
  method: barmanObjectStore
  schedule: "0 45 2 * * *"
