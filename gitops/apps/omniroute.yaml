apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: omniroute
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://github.com/jamilshaikh07/talos-proxmox-gitops
    targetRevision: HEAD
    path: gitops/manifests/omniroute
  destination:
    server: https://kubernetes.default.svc
    namespace: omniroute
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
